[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbamedia"
version = "0.1.0"
description = "Conversor de video y musica a los formatos .gbm/.gbs de GBA Movie Player"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]
dist = ["pyinstaller>=6"]

[project.scripts]
gbamedia = "gbamedia.cli.main:main"

[project.gui-scripts]
gbamedia-gui = "gbamedia.gui.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: recorre ficheros enteros o renderiza pixeles"]
addopts = "-m 'not lento'"
